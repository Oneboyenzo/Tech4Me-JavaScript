<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Sistema de Gerenciamento de Produtos</h1>

    <section class="card">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-produto">
        <div class="form-group">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" required>
        </div>

        <div class="form-group">
          <label for="preco">Preço (R$):</label>
          <input type="number" id="preco" step="0.01" min="0" required>
        </div>

        <div class="form-group">
          <label for="categoria">Categoria:</label>
          <select id="categoria" required>
            <option value="">Selecione...</option>
            <option value="bebidas">Bebidas</option>
            <option value="alimentos">Alimentos</option>
            <option value="higiene">Higiene</option>
            <option value="limpeza">Limpeza</option>
          </select>
        </div>

        <div class="form-group">
          <label for="estoque">Estoque:</label>
          <input type="number" id="estoque" min="0" required>
        </div>

        <button type="submit" class="btn btn-success">Adicionar Produto</button>
      </form>
      <div id="mensagem" class="mensagem"></div>
    </section>

   
    <section class="card">
      <h2>Listagem de Produtos</h2>
      <div class="actions">
        <button id="btn-bebidas" class="btn btn-primary">Listar Apenas Bebidas</button>
        <button id="btn-todos" class="btn btn-secondary">Listar Todos os Produtos</button>
      </div>

      <div id="lista-produtos" class="produtos-grid"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
